<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Page Not Found | Sharma Florist</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="/style.css">
    <style>
        .not-found {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 2rem 1rem;
        }

        .not-found-card {
            width: min(680px, 100%);
            padding: 2.5rem;
            text-align: center;
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 12px 36px rgba(84, 45, 66, 0.14);
        }

        .not-found-card p {
            margin: 1rem auto 1.5rem;
            max-width: 52ch;
        }

        .not-found-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.75rem;
        }

        .not-found-links a {
            display: inline-block;
            padding: 0.75rem 1rem;
            border-radius: 999px;
            background: #b85c8c;
            color: #fff;
            text-decoration: none;
            font-weight: 700;
        }

        .not-found-links a:nth-child(2) {
            background: #7b3060;
        }

        .not-found-links a:nth-child(3) {
            background: #397a55;
        }
    </style>
</head>

<body>
    <main class="not-found">
        <section class="not-found-card" aria-labelledby="not-found-title">
            <p>404</p>
            <h1 id="not-found-title">We couldn’t find that page</h1>
            <p>The link may be outdated. Choose the shop or service you need below.</p>
            <nav class="not-found-links" aria-label="Page not found links">
                <a href="/">Home</a>
                <a href="/rose-n-petals.html">Rose N Petals</a>
                <a href="/sharma-flower-decorators.html">Sharma Flower Decorators</a>
            </nav>
        </section>
    </main>
</body>

</html>
